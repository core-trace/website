<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreTrace - Visão geral</title>
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbarDashboard.css">
    <link rel="stylesheet" href="../css/inicioDashboard.css">
    <link rel="stylesheet" href="../css/detalheServidor.css">
    <link rel="stylesheet" href="../css/servidores.css">
    <link rel="stylesheet" href="../css/servidor.css">
    <script src="../scripts/vendor/chart.umd.js" defer></script>
    <script src="../scripts/navbarDashboard.js" defer></script>
    <script src="../scripts/cenario/cenario-coretrace-7dias.js" defer></script>
    <script src="../scripts/cenario/detalhamento-servidor.js" defer></script>
    <script src="../scripts/monitoramentoMock.js" defer></script>
    <script src="../scripts/dashboardDados.js" defer></script>
    <script src="../scripts/dashboardSimulacao.js" defer></script>
    <script src="../scripts/dashboardAlertasMock.js" defer></script>
    <script src="../data/dashboard-resumo.js" defer></script>
    <script src="../scripts/dashboardCenario.js" defer></script>
    <script src="../scripts/dashboardGraficos.js" defer></script>
    <script src="../scripts/detalheServidor.js" defer></script>
    <script src="../scripts/inicioDashboard.js" defer></script>
    <script src="../scripts/servidor.js" defer></script>
</head>

<body class="dashboard-page dashboard-legivel">
    <a class="dashboard-pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>

    <aside class="dashboard-menu" id="menu-dashboard" aria-label="Menu principal">
        <div class="dashboard-menu-cabecalho">
            <a class="dashboard-logo" href="inicioDashboard.html" aria-label="CoreTrace - Visão geral">
                <img src="../assets/images/CoreTraceBlackLogo.png" alt="CoreTrace" width="581" height="154">
            </a>
            <button class="dashboard-fechar-menu" type="button" aria-label="Fechar menu">
                <span aria-hidden="true">×</span>
            </button>
        </div>

        <nav class="dashboard-navegacao" aria-label="Navegação do dashboard" aria-busy="true">
            <p class="dashboard-acesso-feedback" role="status"></p>
        </nav>
    </aside>

    <div class="dashboard-menu-fundo" aria-hidden="true"></div>
    <div class="dashboard-conteudo">
        <header class="dashboard-navbar visao-navbar">
            <button class="dashboard-abrir-menu" type="button" aria-label="Abrir menu" aria-controls="menu-dashboard"
                aria-expanded="false">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>

            <div class="dashboard-usuario">
                <button class="dashboard-notificacoes" type="button" aria-label="Notificações">
                    <img src="../assets/icons/sino.png" alt="" width="24" height="24">
                </button>

                <div class="dashboard-avatar" role="img" aria-label="Usuário"></div>

                <div class="dashboard-usuario-dados">
                    <span class="dashboard-usuario-nome"></span>
                    <span class="dashboard-usuario-cargo"></span>
                </div>
                <div class="dashboard-conta">
                    <button class="dashboard-usuario-toggle" type="button" aria-label="Abrir menu da conta"
                        aria-controls="menu-conta" aria-expanded="false">
                        <img class="visao-seta-conta" src="../assets/icons/seta-preta.svg" alt="" width="12"
                            height="12">
                    </button>
                    <div class="dashboard-menu-conta" id="menu-conta" hidden>
                        <p class="dashboard-conta-email"></p>
                        <button class="dashboard-sair" type="button">Sair</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="principal" id="conteudo-principal" tabindex="-1">

            <div class="visao-geral">
                <button class="visao-detalhes-botao" onclick="window.location.href = 'servidores.html';"><img src="../assets/icons/seta_vermelha_voltar.svg" alt width="15" height="15">Voltar</button>
                <h1 class="titulo-visao-geral">Visão detalhada de <span id="nomeServidorDetalhado"></span></h1>
                <p class="texto-visao-geral">Veja os detalhes de cada componente.</p>
                <div class="campo-selecionar-e-voltar">
                <span class="visao-select-campo">
                    <select class="visao-select" id="filtro-perfil-servidor" aria-label="Filtrar por perfil">
                        <option value="">Todos os componentes</option>
                        <option value="cpu">CPU</option>
                        <option value="ram">RAM</option>
                        <option value="disco">Disco</option>
                        <option value="rede">Rede</option>
                    </select>
                </span>
                <span class="visao-select-campo">
                    <select class="visao-select" id="filtro-perfil-servidor" aria-label="Filtrar por perfil">
                        <option value="30">Últimos 30 minutos</option>
                        <option value="60">Última hora</option>
                        <option value="360">Últimas 6 horas</option>
                        <option value="720">Últimas 12 horas</option>
                        <option value="1440">Último dia</option>
                    </select>
                </span>
            </div>
            <div class="KPIs-servidor">
                <div class="KPI-servidor">
                    <h3 class="titulo-KPI">Componentes em crítico</h3>
                    <h1 class="dado-principal-KPI" id="quantidadeComponentesCriticos">?</h1>
                    <p class="descricao-KPI-servidor"> Componente(s) em crítico</p>
                </div>
                <div class="KPI-servidor">
                    <h3 class="titulo-KPI">Componentes em atenção</h3>
                    <h1 class="dado-principal-KPI" id="quantidadeComponentesAtencao">?</h1>
                    <p class="descricao-KPI-servidor">Componente(s) em atenção</p>
                </div>
                <div class="KPI-servidor">
                    <h3 class="titulo-KPI">Última coleta</h3>
                    <h1 class="dado-principal-KPI" id="ultimaColeta">?</h1>
                    <p class="descricao-KPI-servidor">Desde a última coleta</p>
                </div>
            </div>
            
        </main>
        

        <body>

        </body>

</html>
