<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/svg+xml" href="/assets/sidebar/logo-compacta.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste AWS S3</title>
</head>

<body>
    <h1>Teste de conexão AWS S3</h1>
    <button id="botao-listar-arquivos">Listar resumos do client</button>
    <h2>Arquivos encontrados:</h2>
    <select id="arquivos-s3">
        <option value="">Selecione um arquivo</option>
    </select>
    <button id="botao-buscar-dados">Buscar dados JSON</button>
    <h2>Resultado:</h2>
    <!--O "<pre>" é muito útil para testes e depuração, pois permite visualizar objetos JSON e respostas da API de maneira organizada.-->
    <pre id="resultado">Aguardando consulta...</pre>
    <script>

        // Elementos HTML
        // Seleciona os elementos da página que serão manipulados pelo JavaScript
        const arquivosS3 = document.querySelector("#arquivos-s3");
        const resultado = document.querySelector("#resultado");
        const botaoListarArquivos = document.querySelector("#botao-listar-arquivos");
        const botaoBuscarDados = document.querySelector("#botao-buscar-dados");

        // Armazenamento dos dados
        // Arrays utilizados para armazenar os arquivos encontrados e o JSON consultado
        let arquivosCarregados = [];
        let dadosJSON = [];

        // Busca os arquivos disponíveis no S3
        async function ListarArquivosS3() {
            try {
                // Realiza uma requisição HTTP GET para a rota do servidor
                // responsável por listar os arquivos existentes no S3
                const resposta = await fetch("/s3Routes/arquivos");

                // Caso a resposta HTTP não tenha sido bem-sucedida,
                // lança um erro e interrompe a execução do try
                if (!resposta.ok) {
                    throw new Error("Erro ao consultar arquivos do S3");
                }

                // Aguarda a resposta do servidor e converte o conteúdo
                // recebido para um objeto JavaScript no formato JSON
                const arquivos = await resposta.json();

                // Filtra os arquivos retornados, mantendo apenas os resumos diários
                // Exemplo: client/resumos/maquina=AA:BB:CC:DD:EE:FF/data=2026-11-22/resumo.json
                const arquivosClient = arquivos.filter(arquivo =>
                    /^client\/resumos\/maquina=[^/]+\/data=[^/]+\/resumo\.json$/.test(arquivo.Key)
                );

                // Retorna apenas os arquivos que passaram pelo filtro
                return arquivosClient;

            } catch (erro) {
                // Exibe o erro no console do navegador
                console.error(erro);

                // Exibe a mensagem de erro na página
                resultado.textContent = erro.message;

                // Retorna null para quem chamou saber que deu erro
                // (um array vazio pareceria "nenhum arquivo" e apagaria a mensagem de erro)
                return null;
            }
        }


        // Renderiza os arquivos no select
        function RenderizarArquivos(arquivos) {

            // Limpa as opções anteriores do select e mantém
            // somente a opção padrão de seleção
            arquivosS3.innerHTML = '<option value="">Selecione um arquivo</option>';

            // Percorre todos os arquivos recebidos
            for (let i = 0; i < arquivos.length; i++) {

                // Cria uma nova opção HTML para o select
                const opcao = document.createElement("option");

                // Define o valor da opção como o caminho completo do arquivo no S3
                // Esse caminho será utilizado posteriormente para buscar o conteúdo
                // Key == nome completo do objeto, exemplo: "client/resumos/maquina=AA:BB:CC:DD:EE:FF/data=2026-11-22/resumo.json"
                opcao.value = arquivos[i].Key;

                // Divide o caminho do arquivo utilizando "/" como separador
                // para permitir acessar individualmente as informações do caminho
                // partes: [client, resumos, maquina=..., data=..., resumo.json]
                const partes = arquivos[i].Key.split("/");

                // Extrai o endereço MAC da máquina, removendo o prefixo "maquina="
                const maquina = partes[2].replace("maquina=", "");

                // Extrai a data, removendo o prefixo "data="
                const data = partes[3].replace("data=", "");

                // Define o texto que será exibido na opção do select,
                // utilizando a máquina e a data (o resumo é um por máquina e dia)
                opcao.textContent = `${maquina} | ${data}`;

                // Adiciona a opção criada ao select da página
                arquivosS3.appendChild(opcao);
            }
        }


        // Busca o conteúdo JSON selecionado
        async function BuscarDadosS3() {

            // Recupera o valor da opção selecionada no select,
            // que corresponde ao caminho completo do arquivo no S3
            const arquivoSelecionado = arquivosS3.value;

            // Verifica se nenhum arquivo foi selecionado
            if (arquivoSelecionado == '') {

                // Exibe uma mensagem solicitando a seleção de um arquivo
                resultado.textContent = "Selecione um arquivo primeiro.";

                // Interrompe a execução da função para evitar uma consulta desnecessária
                return null;
            }

            try {

                // Realiza uma requisição HTTP GET para a rota do servidor responsável
                // por buscar o conteúdo do arquivo selecionado no S3
                // encodeURIComponent codifica caracteres especiais do caminho
                // (o MAC tem ":") para que ele possa ser enviado corretamente na URL
                const resposta = await fetch(
                    `/s3Routes/conteudo?arquivo=${encodeURIComponent(arquivoSelecionado)}`
                );

                // Lê o conteúdo retornado pelo servidor como texto,
                // permitindo analisar a resposta antes de convertê-la para JSON
                const conteudoResposta = await resposta.text();

                // Exibe no console o status HTTP retornado pela requisição
                console.log("Status HTTP:", resposta.status);

                // Exibe no console o conteúdo textual retornado pelo servidor
                // facilitando a identificação de erros durante a consulta
                console.log("Resposta do servidor:", conteudoResposta);

                // Verifica se a requisição HTTP foi bem-sucedida
                // Caso contrário, lança um erro contendo o status e a resposta recebida
                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}: ${conteudoResposta}`);
                }

                // Converte o texto recebido do servidor em um objeto JavaScript
                const respostaS3 = JSON.parse(conteudoResposta);

                // Verifica se o conteúdo do arquivo retornado pelo servidor
                // está armazenado como string ou já está convertido em objeto
                // Caso seja string, utiliza JSON.parse para convertê-lo
                // Caso já seja objeto, utiliza o próprio conteúdo
                const dados = typeof respostaS3.conteudo == "string"
                    ? JSON.parse(respostaS3.conteudo)
                    : respostaS3.conteudo;

                // Retorna os dados JSON do arquivo consultado
                return dados;

            } catch (erro) {
                // Exibe o erro no console do navegador
                console.error(erro);

                // Exibe a mensagem de erro na página
                resultado.textContent = erro.message;

                // Retorna null para não apagar a mensagem de erro ao renderizar
                return null;
            }
        }


        // Renderiza os dados encontrados no JSON
        function RenderizarDados(dados) {

            // Converte o objeto recebido em uma string JSON formatada
            // null indica que não será aplicado nenhum filtro aos dados
            // 2 define a indentação de dois espaços, facilitando a leitura
            // Exibe o resultado diretamente no elemento HTML <pre>
            resultado.textContent = JSON.stringify(dados, null, 2);
        }


        // Executa a busca dos arquivos
        // Adiciona um evento de clique ao botão de listar arquivos
        botaoListarArquivos.addEventListener("click", function () {

            // Avisa que a consulta começou (a listagem pode demorar com muitos arquivos)
            resultado.textContent = "Listando arquivos...";

            // Executa a função que consulta os arquivos no S3
            // O then aguarda a resolução da Promise e recebe os arquivos retornados
            ListarArquivosS3().then(arquivos => {

                // null significa que deu erro e a mensagem já está na página
                if (arquivos === null) {
                    return;
                }

                // Armazena os arquivos encontrados na variável global
                arquivosCarregados = arquivos;

                // Envia os arquivos encontrados para a função responsável
                // por criar e exibir as opções dentro do select
                RenderizarArquivos(arquivosCarregados);

                // Exibe a quantidade de arquivos encontrados na página
                resultado.textContent =
                    `${arquivosCarregados.length} resumos JSON do client encontrados.`;

                // Exibe todos os arquivos encontrados no console do navegador
                // facilitando a conferência dos resultados da consulta
                console.log("Arquivos encontrados:", arquivosCarregados);

            });

        });


        // Executa a busca do conteúdo JSON
        // Adiciona um evento de clique ao botão de buscar dados
        botaoBuscarDados.addEventListener("click", function () {

            // Executa a função que busca o conteúdo do arquivo selecionado
            // O then aguarda a resolução da Promise e recebe os dados retornados
            BuscarDadosS3().then(dados => {

                // null significa que nada foi selecionado ou que deu erro,
                // e a mensagem já está na página
                if (dados === null) {
                    return;
                }

                // Armazena os dados JSON retornados pela consulta
                dadosJSON = dados;

                // Envia os dados para a função responsável por exibi-los
                // formatados na página
                RenderizarDados(dadosJSON);

                // Exibe o conteúdo JSON recebido no console do navegador
                // facilitando a análise e depuração dos dados
                console.log("Dados recebidos do S3:", dadosJSON);

            });

        });

    </script>
</body>
</html>
