<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesso à plataforma de monitoramento CoreTrace.">
    <title>Login | CoreTrace</title>

    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">
    <header class="cabecalho">
        <nav class="navbar" aria-label="Navegação principal">
            <a class="navbar-logo" href="./index.html" aria-label="CoreTrace — início">
                <img src="../assets/images/CoreTraceBlackLogo.png" alt="CoreTrace" width="581" height="154">
            </a>

            <button class="navbar-toggle" type="button" aria-expanded="false" aria-controls="menu-principal"
                aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-menu" id="menu-principal">
                <div class="navbar-menu-cabecalho">
                    <a class="navbar-side-logo" href="./index.html" aria-label="CoreTrace — início">
                        <img src="../assets/images/CoreTraceBlackLogo.png" alt="CoreTrace" width="581" height="154">
                    </a>
                </div>

                <ul class="navbar-links">
                    <li>
                        <a href="./index.html">Página inicial</a>
                    </li>
                    <li>
                        <a href="/pages/sobreNos.html">Sobre nós</a>
                    </li>
                    <li>
                        <a href="/pages/contato.html">Contato</a>
                    </li>
                </ul>

                <div class="navbar-acoes">
                    <a class="navbar-login" href="./login.html" aria-current="page">Login</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="login-layout">
        <section class="login-showcase" aria-labelledby="login-showcase-title">
            <div class="login-showcase__content">
                <span class="login-showcase__accent" aria-hidden="true"></span>
                <h1 id="login-showcase-title">Traga controle para a<br>sua <span>infraestrutura</span></h1>
                <p class="login-showcase__description">Antecipe tomada de decisões de acordo<br class="login-desktop-break">
                    com o estado dos seus servidores.</p>
            </div>
        </section>

        <section class="login-access" aria-labelledby="login-title">
            <div class="login-access__content">
                <a class="login-access__brand" href="./index.html" aria-label="CoreTrace — página inicial">
                    <img src="../assets/images/coretrace-login-logo.svg" alt="CoreTrace" width="334" height="75">
                </a>

                <div class="login-access__heading">
                    <h2 id="login-title">Acesse sua conta</h2>
                    <p>Entre com seus dados para continuar e<br class="login-desktop-break"> acessar sua plataforma</p>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="login-form__control">
                        <label class="login-visually-hidden" for="email">E-mail</label>
                        <img src="../assets/icons/email.svg" alt="" width="17" height="14">
                        <input id="email" name="email" type="email" placeholder="E-mail" autocomplete="username"
                            autocapitalize="none" spellcheck="false" required>
                    </div>

                    <div class="login-form__control">
                        <label class="login-visually-hidden" for="senha">Senha</label>
                        <img src="../assets/icons/cadeado.svg" alt="" width="16" height="17">
                        <input id="senha" name="senha" type="password" placeholder="Senha"
                            autocomplete="current-password" required>
                    </div>

                    <button class="login-form__submit" type="submit">Entrar</button>
                    <p class="login-form__feedback" id="loginFeedback" role="status" aria-live="polite" hidden></p>
                </form>
            </div>
        </section>
    </main>

    <script src="../scripts/navbar.js"></script>
    <script src="../scripts/login.js"></script>
</body>

</html>
